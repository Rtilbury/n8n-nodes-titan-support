
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Verify Canonical schema is packaged
        run: |
          npm pack --dry-run --json > npm-pack-manifest.json
          node -e "
            const manifest = require('./npm-pack-manifest.json');
            const expected = 'dist/schemas/titan-canonical-response.schema.json';
            if (!manifest[0].files.some(file => file.path === expected)) {
              console.error('Canonical schema missing from npm package');
              process.exit(1);
            }
            console.log('Canonical schema confirmed in npm package');
          "
